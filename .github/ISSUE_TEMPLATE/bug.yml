name: Bug report
description: Something does not work as specified
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a failing test. Do not paste secrets, licence keys or private content.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: WordPress, PHP, browser, active theme, locale, website appearance mode.
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is not a security vulnerability (those go through the security policy)
          required: true
