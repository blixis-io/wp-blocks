# Keeps pinned GitHub Actions, npm and Composer dependencies current. Updates arrive as pull requests that must pass CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
    labels: ['area:dx']
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build'
    labels: ['area:dx']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build'
      prefix-development: 'build'
    labels: ['area:dx']
    open-pull-requests-limit: 5
    ignore:
      # @types/node must match the supported Node major (package.json engines, .nvmrc). Raise it together with those.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build'
      prefix-development: 'build'
    labels: ['area:dx']
    open-pull-requests-limit: 5
