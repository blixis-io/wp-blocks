name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only read the repository. No secrets are used, and fork pull requests run with the same limits.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'

jobs:
  commits:
    name: Commit and PR title policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint every commit in the PR (Conventional Commits, no AI attribution)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Lint the PR title (it becomes the squash-commit subject)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  javascript:
    name: JavaScript (format, lint, typecheck, boundaries, tooling tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm check
      - name: Style-resolution reference fixtures (ADR 0005)
        run: python3 -I tests/fixtures/style-resolution/verify.py

  php:
    name: PHP ${{ matrix.php }} (PHPCS, PHPStan, PHPUnit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ADR 0001: the floor, the WordPress-recommended version and the latest stable release.
        php: ['8.2', '8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer validate --strict
      - run: composer run check

  security:
    name: Security (dependency audit, licences, secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, taken from the release's checksums file; update with the version.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: npm advisories (high and above)
        run: pnpm audit --audit-level=high
      - name: Composer advisories
        run: composer audit
      - name: Licence policy (ADR 0008) and GSAP ban
        run: |
          node tooling/check-licenses.mjs
          node tooling/check-boundaries.mjs
      - name: Secret scan (gitleaks, pinned and checksum-verified)
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  # Single status to require once branch protection is available (BWB-125).
  ci:
    name: CI
    if: always()
    needs: [commits, javascript, php, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every required job succeeded
        env:
          EVENT: ${{ github.event_name }}
          COMMITS: ${{ needs.commits.result }}
          JAVASCRIPT: ${{ needs.javascript.result }}
          PHP: ${{ needs.php.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          echo "event=$EVENT commits=$COMMITS javascript=$JAVASCRIPT php=$PHP security=$SECURITY"
          # javascript, php and security must always succeed: a skipped or cancelled job is a failure.
          for r in "$JAVASCRIPT" "$PHP" "$SECURITY"; do
            [ "$r" = "success" ] || { echo "a required job did not succeed"; exit 1; }
          done
          # The commit policy only runs on pull requests; there it must succeed, elsewhere it must be skipped.
          if [ "$EVENT" = "pull_request" ]; then
            [ "$COMMITS" = "success" ] || { echo "commit policy did not succeed"; exit 1; }
          else
            [ "$COMMITS" = "skipped" ] || { echo "commit policy unexpectedly ran"; exit 1; }
          fi
