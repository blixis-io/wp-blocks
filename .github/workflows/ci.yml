name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only read the repository. No secrets are used, and fork pull requests run with the same limits.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'

jobs:
  commits:
    name: Commit and PR title policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint every commit in the PR (Conventional Commits, no AI attribution)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Lint the PR title (it becomes the squash-commit subject)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  javascript:
    name: JavaScript (format, lint, typecheck, boundaries, tooling tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: intl
          tools: composer:v2
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm check
      - name: Style-resolution reference fixtures (ADR 0005)
        run: python3 -I tests/fixtures/style-resolution/verify.py

  php:
    name: PHP ${{ matrix.php }} (PHPCS, PHPStan, PHPUnit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ADR 0001: the floor, the WordPress-recommended version and the latest stable release.
        php: ['8.2', '8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer validate --strict
      - run: composer run check

  security:
    name: Security (dependency audit, licences, secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, taken from the release's checksums file; update with the version.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: npm advisories (high and above)
        run: pnpm audit --audit-level=high
      - name: Composer advisories
        run: composer audit
      - name: Licence policy (ADR 0008) and GSAP ban
        run: |
          node tooling/check-licenses.mjs
          node tooling/check-boundaries.mjs
      - name: Secret scan (gitleaks, pinned and checksum-verified)
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  build:
    name: Build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages that are not scaffolded yet are reported as skipped; scaffolded ones must build reproducibly.
      - name: Build distributable packages twice and compare
        run: pnpm build
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles('dist/*.zip') != ''
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  wordpress:
    name: WordPress ${{ matrix.name }} (integration smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # ADR 0001: the supported floor and the latest releases. Images are pinned by digest.
          - name: '7.0 / PHP 8.2 (floor)'
            expect_wp: '7.0'
            expect_php: '8.2'
            wp_image: 'wordpress:7.0-php8.2-apache@sha256:38b906b70449a4f7d6b8bdfd2b9ad737882c2ae47c177e141fa7ed6f6093ae1e'
            cli_image: 'wordpress:cli-php8.2@sha256:b99fac444f68b8d41b23c6496c7c036082d86a2f6a2b669217d0987a06ef775f'
          - name: '7.1 / PHP 8.5 (latest)'
            expect_wp: '7.1'
            expect_php: '8.5'
            wp_image: 'wordpress:7.1.3-php8.5-apache@sha256:c12bed9c5af9d76261221c2af3a6216a074dd80b4fc2459588b3cbf2dd8e1798'
            cli_image: 'wordpress:cli-php8.5@sha256:52d8832dc8b90022c22fe963e696e4107d86f68b9b891e9624d82fec94fdc3b7'
    env:
      BLX_WP_IMAGE: ${{ matrix.wp_image }}
      BLX_CLI_IMAGE: ${{ matrix.cli_image }}
      BLX_EXPECT_WP: ${{ matrix.expect_wp }}
      BLX_EXPECT_PHP: ${{ matrix.expect_php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start WordPress and seed fixtures
        run: pnpm wp:start
      - name: Smoke test
        run: pnpm wp:smoke
      - name: Container logs on failure
        if: failure()
        run: pnpm wp:logs
      - name: Tear down
        if: always()
        run: pnpm wp:reset

  # Single status to require once branch protection is available (BWB-125).
  ci:
    name: CI
    if: always()
    needs: [commits, javascript, php, build, wordpress, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every required job succeeded
        env:
          EVENT: ${{ github.event_name }}
          COMMITS: ${{ needs.commits.result }}
          JAVASCRIPT: ${{ needs.javascript.result }}
          PHP: ${{ needs.php.result }}
          BUILD: ${{ needs.build.result }}
          WORDPRESS: ${{ needs.wordpress.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          echo "event=$EVENT commits=$COMMITS javascript=$JAVASCRIPT php=$PHP build=$BUILD wordpress=$WORDPRESS security=$SECURITY"
          # javascript, php, build, wordpress and security must always succeed: a skipped or cancelled job is a failure.
          for r in "$JAVASCRIPT" "$PHP" "$BUILD" "$WORDPRESS" "$SECURITY"; do
            [ "$r" = "success" ] || { echo "a required job did not succeed"; exit 1; }
          done
          # The commit policy only runs on pull requests; there it must succeed, elsewhere it must be skipped.
          if [ "$EVENT" = "pull_request" ]; then
            [ "$COMMITS" = "success" ] || { echo "commit policy did not succeed"; exit 1; }
          else
            [ "$COMMITS" = "skipped" ] || { echo "commit policy unexpectedly ran"; exit 1; }
          fi
